<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="account-container">
        <h3>Account</h3>
        <p id="account-status" class="hidden"></p>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required minlength="12" autocomplete="current-password" />
          </div>
          <button type="submit">Sign In</button>
        </form>
        <button type="button" id="logout-button" class="hidden">Sign Out</button>
        <form id="account-create-form" class="hidden">
          <h4>Create Account</h4>
          <div class="form-group">
            <label for="new-email">Email:</label>
            <input type="email" id="new-email" required autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="new-password">Temporary password:</label>
            <input type="password" id="new-password" required minlength="12" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="new-role">Role:</label>
            <select id="new-role" required>
              <option value="student">Student</option>
              <option value="staff">Staff</option>
            </select>
          </div>
          <button type="submit">Create Account</button>
        </form>
        <div id="account-message" class="hidden" aria-live="polite"></div>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
